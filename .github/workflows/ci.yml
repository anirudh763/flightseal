name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libsqlite3-dev ffmpeg
          pip install pyulog==1.3.0 pytest pyyaml==6.0.2
      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build -DFSEAL_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j
      - name: C++ tests (format, tampering, receipts, kill -9 crashes, --version, cmake --install)
        run: ctest --test-dir build --output-on-failure
      - name: Python tests (CLI, independent reader, real PX4 flight)
        run: python -m pytest -q
      - name: Receipt registry (Ed25519 vectors, fresh C++ receipts, every matrix row over the in-memory table)
        run: python -m pytest -q registry/tests
      - name: JS verifier agrees with the CLI and the Python reader (every attack, hostile files, PX4 flight)
        run: node --test tests/web/verifier.test.mjs tests/web/copy.test.mjs tests/web/workbench.test.mjs tests/web/redirect.test.mjs tests/web/rawfile.test.mjs tests/web/sw-cache-index.test.mjs tests/web/manifest.test.mjs
      - name: Demo on a real PX4 flight
        run: tools/demo.sh

  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install the pinned CDK toolchain
        working-directory: infra
        run: npm ci
      - name: Build, synthesise with no AWS credentials and assert the registry stack
        working-directory: infra
        env:
          AWS_CONFIG_FILE: /dev/null
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
        run: |
          npm run build
          npm test

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build the CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j --target fseal-cli
      - name: Install Playwright and axe-core
        working-directory: tests/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the canonical HashWing workbench
        working-directory: newweb
        run: |
          npm ci
          npm run build
      - name: Verifier page (samples match the CLI, hostile files, axe-core light and dark)
        run: node tests/web/e2e.mjs
      - name: Verifier screens (routes, focus, Menu sheet, Back/Forward, deep and old links, light default, axe-core)
        run: node tests/web/routes.mjs
      - name: Download the public PX4 sample flight the Seal & send test uses
        run: python3 tools/fetch_sample.py tests/.data
      - name: File failure, retry, stale selection and report download regressions
        run: node tests/web/hardening.mjs

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan reachable history and prove the receipt exception stays narrow
        run: |
          /tmp/gitleaks git . --config .gitleaks.toml --redact=100 --no-banner --log-opts=--all
          python3 tools/check_receipt_allowlist.py /tmp/gitleaks

  wasm-console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Verify shipped module provenance and rebuild the native bridge
        run: |
          python3 tools/verify_wasm_provenance.py
          scripts/build_wasm.sh
      - name: Test the compiled native bridge
        run: node --test tests/wasm/bridge.test.mjs tests/wasm/enterprise-edge.test.mjs tests/wasm/import.test.mjs tests/wasm/output-storage.test.mjs tests/wasm/hash.test.mjs
      - name: Install browser dependencies
        working-directory: tests/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Native browser worker verification, sealing and cancellation
        run: node --test tests/wasm/browser.test.mjs tests/wasm/hash-browser.test.mjs
      - name: Build React console
        working-directory: newweb
        run: |
          npm ci
          node --test tests/report-pdf.test.mjs
          node --test tests/trusted-keys.test.mjs tests/recipient-trust.test.mjs tests/pilot-authorization.test.mjs tests/pilot-verify.test.mjs tests/pilot-keys.test.mjs
          node --test tests/jobs-store.test.mjs tests/routes.test.mjs
          npm run build
      - name: Registry outbox and client unit tests (state machine, backoff, allowlist, owner isolation, stale results)
        run: node --test newweb/tests/outbox.test.mjs newweb/tests/registry-client.test.mjs newweb/tests/registry-session.test.mjs
      - name: Registry outbox in Chromium against the real registry App (DEV ONLY server over the in-memory table)
        run: |
          python3 registry/devserver/server.py --port 39102 --pilot-keys-orgs orgP > /tmp/registry-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; wait "$server_pid" || true' EXIT
          for attempt in $(seq 1 50); do
            if grep -q READY /tmp/registry-dev.log; then break; fi
            sleep 0.2
          done
          grep READY /tmp/registry-dev.log
          REGISTRY_DEV_URL=http://127.0.0.1:39102 node --test newweb/tests/outbox-browser.mjs
      - name: Registry wiring in the console (flag-off bundle scan, then a flag-on build against the DEV ONLY server)
        run: |
          python3 registry/devserver/server.py --port 39103 --pilot-keys-orgs orgP > /tmp/registry-wiring.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; wait "$server_pid" || true' EXIT
          for attempt in $(seq 1 50); do
            if grep -q READY /tmp/registry-wiring.log; then break; fi
            sleep 0.2
          done
          grep READY /tmp/registry-wiring.log
          REGISTRY_DEV_URL=http://127.0.0.1:39103 node newweb/tests/registry-wiring.mjs
      - name: Download the public PX4 sample flight the Seal & send test uses
        run: python3 tools/fetch_sample.py tests/.data
      - name: Console flows, mobile layouts and accessibility
        working-directory: newweb
        run: npm run test:browser
      - name: Nine real-engine edge cases and tampered report exports
        run: node newweb/tests/edge-matrix.mjs
      - name: Root-hosted keyboard, offline updates and production routes
        run: |
          python3 -m venv /tmp/hashwing-http-venv
          /tmp/hashwing-http-venv/bin/pip install -r requirements-web.txt
          /tmp/hashwing-http-venv/bin/python tools/http_server.py --root docs --app hashwing --port 39101 > /tmp/hashwing-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; wait "$server_pid" || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:39101/readyz > /dev/null; then break; fi
            sleep 0.2
          done
          curl --fail --silent http://127.0.0.1:39101/readyz
          HASHWING_BASE_URL=http://127.0.0.1:39101 node --test newweb/tests/action-offline.mjs
          HASHWING_BASE_URL=http://127.0.0.1:39101 node newweb/tests/product-routes.mjs
      - name: Preserve the browser and native edge-case proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flightseal-enterprise-qa
          path: |
            .test-artifacts/
            newweb/.test-artifacts/
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: One-command container verification (native, Python, JavaScript, Wasm and frontend build)
        run: scripts/check_docker.sh
      - name: Build and smoke-test the non-root CLI runtime
        run: |
          docker build --target runtime --tag flightseal-runtime:ci .
          test "$(docker run --rm --network none --cap-drop ALL --read-only flightseal-runtime:ci --version)" = "fseal $(sed -n 's/^project(flightseal VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          docker run --rm --network none --cap-drop ALL --read-only flightseal-runtime:ci --help

  release-dry-run:
    # The release workflow's build-and-container steps, run on every push without publishing anything.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: Build, test, check in a clean ubuntu:24.04 container, write the SHA-256 file (tools/release_build.sh)
        run: tools/release_build.sh dist
      - name: The binary prints the version in CMakeLists.txt
        run: test "$(dist/fseal-linux-x86_64 --version)" = "fseal $(sed -n 's/^project(flightseal VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
      - name: The binary is hardened (readelf; PIE, full RELRO, NX stack, stack protector, _FORTIFY_SOURCE)
        run: tools/check_hardening.sh dist/fseal-linux-x86_64 build-release

  http-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install HTTP runtime test dependencies
        run: python -m pip install -r requirements-web.txt pytest
      - name: HTTP runtime security, routing and lifecycle regressions
        run: python -m pytest -q tests/http_server_regression.py
