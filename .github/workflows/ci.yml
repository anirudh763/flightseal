name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libsqlite3-dev ffmpeg
          pip install pyulog==1.3.0 pytest pyyaml==6.0.2
      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build -DFSEAL_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j
      - name: C++ tests (format, tampering, receipts, kill -9 crashes, --version, cmake --install)
        run: ctest --test-dir build --output-on-failure
      - name: Python tests (CLI, independent reader, real PX4 flight)
        run: python -m pytest -q
      - name: JS verifier agrees with the CLI and the Python reader (every attack, hostile files, PX4 flight)
        run: node --test tests/web/verifier.test.mjs tests/web/copy.test.mjs
      - name: Demo on a real PX4 flight
        run: tools/demo.sh

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build the CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j --target fseal-cli
      - name: Install Playwright and axe-core
        working-directory: tests/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verifier page (samples match the CLI, hostile files, axe-core light and dark)
        run: node tests/web/e2e.mjs
      - name: Verifier screens (routes, focus, Menu sheet, Back/Forward, deep and old links, light default, axe-core)
        run: node tests/web/routes.mjs
      - name: File failure, retry, stale selection and report download regressions
        run: node tests/web/hardening.mjs

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan reachable history and prove the receipt exception stays narrow
        run: |
          /tmp/gitleaks git . --config .gitleaks.toml --redact=100 --no-banner --log-opts=--all
          python3 tools/check_receipt_allowlist.py /tmp/gitleaks

  wasm-console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Verify shipped module provenance and rebuild the native bridge
        run: |
          python3 tools/verify_wasm_provenance.py
          scripts/build_wasm.sh
      - name: Test the compiled native bridge
        run: node --test tests/wasm/bridge.test.mjs
      - name: Install browser dependencies
        working-directory: tests/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Native browser worker verification, sealing and cancellation
        run: node --test tests/wasm/browser.test.mjs
      - name: Build React console
        working-directory: newweb
        run: |
          npm ci
          npm run build
      - name: Console flows, mobile layouts and accessibility
        working-directory: newweb
        run: npm run test:browser

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: One-command container verification (native, Python, JavaScript, Wasm and frontend build)
        run: scripts/check_docker.sh
      - name: Build and smoke-test the non-root CLI runtime
        run: |
          docker build --target runtime --tag flightseal-runtime:ci .
          test "$(docker run --rm --network none --cap-drop ALL --read-only flightseal-runtime:ci --version)" = "fseal $(sed -n 's/^project(flightseal VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          docker run --rm --network none --cap-drop ALL --read-only flightseal-runtime:ci --help

  release-dry-run:
    # The release workflow's build-and-container steps, run on every push without publishing anything.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: Build, test, check in a clean ubuntu:24.04 container, write the SHA-256 file (tools/release_build.sh)
        run: tools/release_build.sh dist
      - name: The binary prints the version in CMakeLists.txt
        run: test "$(dist/fseal-linux-x86_64 --version)" = "fseal $(sed -n 's/^project(flightseal VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
      - name: The binary is hardened (readelf; PIE, full RELRO, NX stack, stack protector, _FORTIFY_SOURCE)
        run: tools/check_hardening.sh dist/fseal-linux-x86_64 build-release
