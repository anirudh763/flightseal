name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libsqlite3-dev
          pip install pyulog==1.3.0 pytest
      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build -DFSEAL_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j
      - name: C++ tests (format, tampering, receipts, kill -9 crashes)
        run: ctest --test-dir build --output-on-failure
      - name: Python tests (CLI, independent reader, real PX4 flight)
        run: python -m pytest -q
      - name: JS verifier agrees with the CLI and the Python reader (every attack, hostile files, PX4 flight)
        run: node --test tests/web/verifier.test.mjs tests/web/copy.test.mjs
      - name: Demo on a real PX4 flight
        run: tools/demo.sh

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build the CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j --target fseal-cli
      - name: Install Playwright and axe-core
        working-directory: tests/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verifier page (samples match the CLI, hostile files, axe-core light and dark)
        run: node tests/web/e2e.mjs
