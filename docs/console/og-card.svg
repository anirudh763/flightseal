<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">HashWing local FlightSeal verification</title>
  <desc id="desc">A technical verification preview showing an intact 800-record demo chain, valid signatures against the bundled demo key and 800 of 800 receipt coverage.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#183044" stroke-width="1"/></pattern>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#111d2c"/><stop offset="1" stop-color="#0c1724"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0B1120"/><rect width="1200" height="630" fill="url(#grid)" opacity=".65"/>
  <path d="M0 510H1200" stroke="#173b45"/><circle cx="1060" cy="80" r="220" fill="#10B981" opacity=".06"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="76" y="70" width="44" height="44" rx="10" fill="#10B981"/><path d="M90 98V84l8-5 8 5v14l-8 5z" fill="none" stroke="#06241c" stroke-width="3"/>
    <text x="136" y="101" fill="#f0f8f6" font-size="25" font-weight="700">HashWing</text>
    <text x="76" y="194" fill="#10B981" font-size="16" font-weight="700" letter-spacing="3">LOCAL FLIGHT LOG VERIFICATION</text>
    <text x="76" y="250" fill="#f5faf9" font-size="48" font-weight="700">Check the log.</text>
    <text x="76" y="306" fill="#f5faf9" font-size="48" font-weight="700">Keep the evidence.</text>
    <text x="76" y="352" fill="#aec0ce" font-size="19">C++ / OpenSSL / WebAssembly · runs in this browser</text>
    <rect x="650" y="144" width="472" height="340" rx="14" fill="url(#panel)" stroke="#254253" stroke-width="2"/>
    <text x="686" y="188" fill="#91a9b9" font-size="14" font-weight="650" letter-spacing="1.5">INCLUDED 800-RECORD DEMO</text>
    <rect x="686" y="210" width="400" height="78" rx="8" fill="#0e291f" stroke="#176d4d"/>
    <circle cx="720" cy="249" r="14" fill="#10B981"/><path d="m713 249 5 5 10-11" fill="none" stroke="#08251d" stroke-width="3"/>
    <text x="750" y="246" fill="#dff8ec" font-size="24" font-weight="700">INTACT</text>
    <text x="750" y="269" fill="#9bcab4" font-size="14">computed by the local verifier</text>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">
      <text x="686" y="333" fill="#9ab0bd">CHAIN</text><text x="1068" y="333" fill="#10B981" text-anchor="end">INTACT</text>
      <text x="686" y="377" fill="#9ab0bd">SIGNATURE</text><text x="1068" y="377" fill="#10B981" text-anchor="end">MATCH</text>
      <text x="686" y="421" fill="#9ab0bd">COVERAGE</text><text x="1068" y="421" fill="#10B981" text-anchor="end">800 / 800</text>
    </g>
    <text x="686" y="459" fill="#96aab6" font-size="13">Bundled demo key only · not flight provenance</text>
    <text x="76" y="560" fill="#8397a5" font-size="15">Integrity does not prove sensor truth, capture time, identity or independent custody.</text>
    <text x="76" y="594" fill="#10B981" font-size="14" font-weight="650">FREE · LOCAL · NO CLOUD VERIFICATION SERVICE</text>
  </g>
</svg>
